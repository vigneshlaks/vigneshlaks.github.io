        class TreeRenderer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.nodes = [];
                this.edges = [];
                this.nodeContent = {};
                
                this.canvas.addEventListener('click', (e) => this.handleClick(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            }

            addNode(x, y, content = null, state = 'structure') {
                const index = this.nodes.length;
                this.nodes.push({ x, y, state });
                this.nodeContent[index] = content;
                return index;
            }

            addEdge(from, to) {
                this.edges.push({ from, to });
            }

            handleClick(e) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                this.nodes.forEach((node, index) => {
                    const distance = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);
                    
                    if (distance <= 8 && (node.state === 'writing' || node.state === 'structure')) {
                        this.onNodeClick(node, index);
                    }
                });
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                let overClickableNode = false;
                
                this.nodes.forEach((node, index) => {
                    const distance = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);
                    
                    if (distance <= 8 && (node.state === 'writing' || node.state === 'structure')) {
                        overClickableNode = true;
                    }
                });
                
                this.canvas.style.cursor = overClickableNode ? 'pointer' : 'default';
            }

            onNodeClick(node, index) {
                const contentDiv = document.getElementById('card-content');
                const headerDiv = document.getElementById('card-header');
                const textDiv = document.getElementById('card-text');
                
                // Set card content based on node
                const content = this.nodeContent[index];
                if (content) {
                    headerDiv.textContent = content.title;
                    textDiv.innerHTML = content.content;
                    contentDiv.style.display = 'block';
                }
                
                this.draw();
            }

            drawNode(node, index) {
                const radius = 4;
                
                this.ctx.beginPath();
                this.ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);
                
                if (node.state === 'writing') {
                    this.ctx.fillStyle = '#555';
                } else {
                    this.ctx.fillStyle = '#ccc';
                }
                this.ctx.fill();
            }

            drawEdge(edge) {
                const fromNode = this.nodes[edge.from];
                const toNode = this.nodes[edge.to];
                
                this.ctx.strokeStyle = '#ccc';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(fromNode.x, fromNode.y);
                this.ctx.lineTo(toNode.x, toNode.y);
                this.ctx.stroke();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.edges.forEach(edge => this.drawEdge(edge));
                
                this.nodes.forEach((node, index) => this.drawNode(node, index));
            }

            clear() {
                this.nodes = [];
                this.edges = [];
                this.nodeContent = {};
            }
        }

                title: "Palo Alto",
                content: `
        <p>I wanted to act as more of an onlooker during my time in Palo Alto. It was different world than the one I was used to on the east coast. I didn't think it would be conducive to development to submerge myself.</p>

        –

        <p>I always felt I would more naturally fit into the culture I fixed onto New York.</p>

        <p>Bustling horns, quick walking, skyscrapers, suits; places to be and things to do. I didn't like the informality, amongst other things, I had associated with California.</p>

        <p>But I never expected the joy I would derive from taking a bike ride and the positive effects it would have on my work. Or the wonder I would feel while passing the houses, each one disjoint. Not disjoint in the local area surrounding the house but disjoint period.</p>

        –

        <p>A roommate of mine was growing bread and the other growing oats.</p>

        <p>I was curious if the bread could grow indefinitely. But then apparently the bread eventually dies when you put it into the oven. With this line of reasoning, what remains is a carcass.</p>

        <p>I wonder if we'll create heat resistant yeast in the future and have indefinite growing bread.</p>

        <p>Diclaimer: I don't know how bread works.</p>

        –

        <p>I suspect even a strict interpretation of ghost races would map to the environment as even the weather never changed.</p>

        –

        <p>I've realized how much I've gained a reliance on technology.</p>

        <p>I attempted to put this a bit to one side by not using a gps for the bike ride to the office.</p>

        <p>Not from a place of strong distaste. It's a beautiful thing to have the ability to construct a path from point a to point b with ease, but rather to see what might come of it.</p>

        <p>I realized the specific path given by the gps was unnecessarily constrained. There were a series of roads and I just needed to move generally in one direction for quite a while. The decision of which of those roads was chosen by the gps was a bit arbitrary.</p>

        <p>If I moved too far in one direction then I could just recorrect by moving over one street. During my trip, the arbitrary paths converged when I reached an underpass. As long as I hit the underpass, the road selection was more open ended than I would have perceived if I wasn't willing to experiment.</p>

        <p>After a few trips, I was completing the entire sequence quickly with greater freedom.</p>

        –

        <p>We can make a lot of meals with a few ingredients.</p>

        <p>There's a more verbose argument with conditioning, combinations, orthogonality, steps as to why cooking with only a few ingredients is reasonable.</p>

        <p>But it's pretty unnecessary. Essentially, if we carefully choose base ingredients and get a really good feel for these base ingredients we can combine them in different ways and make varying meals. We can also do this quite quickly because of our understanding of each ingredient.</p>

        <p>The process of incorporating new ingredients is done organically. If our decision for the base set of ingredients is unopinionated, there will be a lot of interplay with the new ingredient. Incorporating new ingredients in this way have implied utility as it's only been incorporated because it has something to offer.</p>

        <p>Half way through the summer, I got bored of my meals and incorporated a new ingredient to see what would happen. The food had renewed vitality.</p>
                `

                title: "Utilitarian Meditation", 
                content: `<p>A purpose for meditating is to promote greater general clarity and more readily and deeply absorb works.</p>

        <p>There's also literature associating meditation with reducing stress amongst other benefits.</p>

        <p>Meditation can be something difficult to turn into a baseline habit; instead more readily lending itself to be spoken about than consistently practiced.</p>

        <p>It can be hard to slow down enough to reap the benefits though and introducing tactile, short term benefits can help accommodate this shortcoming.</p>

        <p>Taking a loose definition of meditation as building the capacity to be in the present moment then it doesn't need to be associated with a specific seating position or breathing technique.</p>

        <p>Taking some task which can be done absent mindedly but instead fighting this natural tendency still fits within the definition.</p>

        <p>We are both practicing mindfulness while also completing a task. I've found most tasks can be done more efficiently and with higher quality when we simply pay attention to them. Depending on the natural tendency to be unmindful, the mind may slip into a shallower focus muddying our ability to complete what should be a trivial task.</p>

        <p>All of this to say when doing an absentmindable task; don't be absent minded instead attempt to be present. This both promotes task quality and upstream development.</p>`
            }, 'writing');

            const potemkin_village = renderer.addNode(positions.potemkin_village[0], positions.potemkin_village[1], {
                title: "Potemkin Village",
                content: `<p>Presentation leads to increased serendipity and is widely applicable.</p>

        <p>However, it should only exist as a mechanism for either implying an internal mechanism or enfolding into an ecosystem. If a shiny exterior becomes the goal in it of itself or fit onto very hard as a metric for either parties, issues arise.</p>

        <p>Reminiscent of, "when a method becomes a target, it ceases to be a good measure".</p>

        <p>With that being said, investing into presentation is worthwhile. Any application of presentation helps build upstream presentation skills aiding in creation. It's interesting to see at least in this sector the trivialization of implementation with even somewhat refined taste.</p>

        <p>I wonder where else this will permeate to in the future.</p>

        —

        <p>Speak through actions not words.</p>`
            }, 'writing');

            const automaton = renderer.addNode(positions.automaton[0], positions.automaton[1], {
                title: "Automaton",
                content: `<p>Pursuing many disjoint directions creates a sense of pseudo productivity.</p>

        <p>Not only is learning diminished but so is the ability to look at the world through one's own eyes instead of an aggregation of surrounding ones.</p>

        <p>Individually orienting in a unique direction and moving implies confidence. Even if one musters the confidence, the inertia of the initial movement is difficult to overtake and only trivial ideas surface. Past this impasse, a differentiated position is found. Reasoning properly allows the position to be a leveraged one.</p>`
            }, 'writing');

            const self_inflicted_boxes = renderer.addNode(positions.self_inflicted_boxes[0], positions.self_inflicted_boxes[1], {
                title: "Self Inflicted Boxes",
                content: `<p>I had a friend refer to the transition out of college into the workforce as leaving one matrix and entering another.</p>

        —

        <p>I suspect for many their actions are only a consequence of worry regarding some external factor. Action derived in this way is unsustainable and notions of "breaks" arise naturally.</p>

        <p>A reframing of work and learning is in order – from stress and anxiety to curiosity and enjoyment.</p>
