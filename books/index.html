<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/initial_logo.ico">

    <title>Books</title>
    <style>
        html {
            font-size: 14px;
        }

        body {
            font-family: 'Palatino', serif;
            background: #fff;
            color: #000;
            line-height: 1.4;
            margin: 0;
            padding: 0;
        }

        header {
            border-bottom: none;
            padding: 60px 20px 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: normal;
            margin: 0;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: calc(100vh - 220px);
            justify-content: center;
            padding: 0 20px;
        }

        #breadcrumb {
            font-size: 11px;
            color: #999;
            margin-bottom: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 450px;
            display: none;
        }

        #breadcrumb:hover { color: #555; }

        #view {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        #view .post-list {
            max-width: 100%;
        }

        #view .section-label {
            max-width: 100%;
        }

        #view .post-divider {
            max-width: 100%;
        }

        .section-label {
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            width: 100%;
            max-width: 450px;
            margin: 0 0 4px 0;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
            max-width: 450px;
        }

        .post-item {
            border: 1px solid #ddd;
            background: #fff;
            padding: 20px 25px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .post-item:hover {
            transform: translateY(-4px);
        }

        .post-item:hover .post-title {
            text-decoration: underline;
        }

        .post-item.reading {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        .post-item.reading:hover {
            transform: none;
        }

        .post-item.reading:hover .post-title {
            text-decoration: none;
        }

        .post-title {
            font-size: 1rem;
            font-weight: normal;
            margin: 0;
            color: #000;
        }

        .post-divider {
            width: 100%;
            max-width: 450px;
            border-top: 1px solid #eee;
            margin: 8px 0;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        footer a {
            color: #999;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .post-list { max-width: 90%; }
            .post-item { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Books</h1>
    </header>

    <main>
        <div id="breadcrumb">←</div>
        <div id="view"></div>
    </main>

    <script>
        const categories = {
            'Spiritual / Philosophy': [
                { title: "Sophie's World", href: 'philosophy/sophies-world.html' },
                { title: "Man's Search for Meaning", href: 'philosophy/mans-search-for-meaning.html' }
            ],
            'Fantasy': [
                { title: 'Stormlight Archive Series', href: 'fantasy/stormlight-archive.html' },
                { title: 'Game of Thrones Series', href: 'fantasy/game-of-thrones.html' }
            ],
            'Fiction': [
                { title: 'The Martian', href: 'fiction/the-martian.html' }
            ],
            'Nonfiction': [
                { title: 'Zero to One', href: 'nonfiction/zero-to-one.html' },
                { title: "Can't Hurt Me", href: 'nonfiction/cant-hurt-me.html' }
            ],
            'Biography': [
                { title: 'Steve Jobs', href: 'biography/steve-jobs.html' }
            ]
        };

        const view = document.getElementById('view');
        const breadcrumb = document.getElementById('breadcrumb');

        function showTopLevel() {
            breadcrumb.style.display = 'none';

            let html = `
                <p class="section-label">Read</p>
                <div class="post-list">
                    ${Object.keys(categories).map(cat => `
                        <article class="post-item" onclick="showCategory('${cat.replace(/'/g, "\\'")}')">
                            <h3 class="post-title">${cat}</h3>
                        </article>
                    `).join('')}
                </div>
            `;
            view.innerHTML = html;
        }

        function showCategory(name) {
            const books = categories[name];

            breadcrumb.style.display = 'block';
            breadcrumb.onclick = showTopLevel;

            let html = `
                <p class="section-label">${name}</p>
                <div class="post-list">
                    ${books.map(book => `
                        <article class="post-item${book.href ? '' : ''}" ${book.href ? `onclick="window.location.href='${book.href}'"` : ''}>
                            <h3 class="post-title">${book.title}</h3>
                        </article>
                    `).join('')}
                </div>
            `;
            view.innerHTML = html;
        }

        showTopLevel();
    </script>
</body>
</html>
