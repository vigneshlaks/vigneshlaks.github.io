<body>
    <header>
        <h1>Vignesh Lakshmanan</h1>
        <p>UPenn CS + Robotics</p>
        <p> <a href="https://x.com/va_laksh" target="_blank">X</a> – <a href="https://www.linkedin.com/in/vigneshlaksh/" target="_blank">LinkedIn</a> – <a href="https://github.com/vigneshlaks" target="_blank">GitHub</a></p>

    <div class="tree-container">
        <div class="container">
            <canvas id="tree" class="tree-canvas" width="480" height="280"></canvas>
        </div>
        <section id="card-content" style="display: none; margin-top: 30px;">
            <div class="writing-item">
                <div class="writing-header" id="card-header">Node Content</div>
                <div class="writing-thoughts">
                    <div id="card-text"></div>
                </div>
            </div>
        </section>
    </div>

    <script>
        class TreeRenderer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.nodes = [];
                this.edges = [];
                this.nodeContent = {};
                this.nodeNames = {};
                
                this.canvas.addEventListener('click', (e) => this.handleClick(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            }

            addNode(x, y, content = null, state = 'structure') {
                const index = this.nodes.length;
                this.nodes.push({ x, y, state });
                this.nodeContent[index] = content;
                return index;
            }

            addEdge(from, to) {
                this.edges.push({ from, to });
            }

            handleClick(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;

                this.nodes.forEach((node, index) => {
                    const distance = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);

                    if (distance <= 8 && index !== 0) {
                        this.onNodeClick(node, index);
                    }
                });
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;

                let overClickableNode = false;
                

                this.nodes.forEach((node, index) => {
                    const distance = Math.sqrt((mouseX - node.x) ** 2 + (mouseY - node.y) ** 2);

                    if (distance <= 8 && index !== 0) {
                        overClickableNode = true;
                    }
                });

                this.canvas.style.cursor = overClickableNode ? 'pointer' : 'default';
            }

            onNodeClick(node, index) {
                const contentDiv = document.getElementById('card-content');
                const headerDiv = document.getElementById('card-header');
                const textDiv = document.getElementById('card-text');

                // Set card content based on node
                const content = this.nodeContent[index];
                if (content) {
                    headerDiv.textContent = content.title;
                    if (node.state === 'writing') {
                        textDiv.innerHTML = content.content;
                    } else {
                        textDiv.innerHTML = '';
                    }
                    contentDiv.style.display = 'block';
                }

                this.draw();
            }

            drawNode(node, index) {
                const radius = 4;

                this.ctx.beginPath();
                this.ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);

                if (node.state === 'writing') {
                    this.ctx.fillStyle = '#555';
                } else {
                    this.ctx.fillStyle = '#ccc';
                }
                this.ctx.fill();
            }

            drawEdge(edge) {
                const fromNode = this.nodes[edge.from];
                const toNode = this.nodes[edge.to];
                
                this.ctx.strokeStyle = '#ccc';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(fromNode.x, fromNode.y);
                this.ctx.lineTo(toNode.x, toNode.y);
                this.ctx.stroke();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.edges.forEach(edge => this.drawEdge(edge));
                
                this.nodes.forEach((node, index) => this.drawNode(node, index));
            }

            clear() {
                this.nodes = [];
                this.edges = [];
                this.nodeContent = {};
            }
        }

        const renderer = new TreeRenderer('tree');

        function getLayoutPositions() {
            return {
                root: [240, 140],
                irl: [240, 90], knowledge_acquisition: [190, 115], orientation: [290, 115], systems: [190, 165], implementation: [290, 165],
                palo_alto: [220, 70], utilitarian_meditation: [260, 70],
                potemkin_village: [155, 95], automaton: [170, 125],
                self_inflicted_boxes: [310, 95], individualized_shortest_paths: [330, 80], affinity_for_technicality: [325, 115],
                stones_birds_dominoes: [305, 135], judgement: [275, 95],
                consumption: [155, 195], hatch: [170, 215], ghost_races: [205, 200],
                more_is_more: [325, 185], unopinionation: [310, 205], lulls: [355, 170],
                matryoshka: [370, 195], forward: [335, 150], axes: [365, 225], whimsy: [355, 205],
                caves_and_lights: [315, 235], mach_horses: [395, 235]
            };
        }

        function Tree() {
            renderer.clear();
            const positions = getLayoutPositions();
    
            const root = renderer.addNode(positions.root[0], positions.root[1], {
                title: "Creation",
                content: ``
            });
            
            const irl = renderer.addNode(positions.irl[0], positions.irl[1], {
                title: "Real Life",
                content: ``
            });
            const knowledge_acquisition = renderer.addNode(positions.knowledge_acquisition[0], positions.knowledge_acquisition[1], {
                title: "Knowledge Acquisition",
                content: ``
            });
            const orientation = renderer.addNode(positions.orientation[0], positions.orientation[1], {
                title: "Orientation",
                content: ``
            });
            const systems = renderer.addNode(positions.systems[0], positions.systems[1], {
                title: "Systems",
                content: ``
            });
            const implementation = renderer.addNode(positions.implementation[0], positions.implementation[1], {
                title: "Implementation",
                content: ``
            });
            const palo_alto = renderer.addNode(positions.palo_alto[0], positions.palo_alto[1], {
                title: "Palo Alto",
                content: `
        <p>I wanted to act as more of an onlooker during my time in Palo Alto. It was different compared to the east coast. I didn't think it would be conducive to development to submerge myself.</p>

        –

        <p>I always felt I would more naturally fit into the culture I fixed onto New York.</p>

        <p>Bustling horns, quick walking, skyscrapers, suits; places to be and things to do. I didn't like the informality, amongst other things, I had associated with California.</p>

        <p>But I never expected the joy I would derive from taking a bike ride and the positive effects it would have on my work. Or the wonder I would feel while passing the houses, each one disjoint. Not disjoint in the local area surrounding the house but disjoint period.</p>

        –

        <p>I've realized how much I've gained a reliance on technology.</p>

        <p>I attempted to put this a bit to one side by not using a gps for the bike ride to the office.</p>

        <p>Not from a place of strong distaste. It's a beautiful thing to have the ability to construct a path from point a to point b with ease, but rather to see what might come of it.</p>

        <p>I realized the specific path given by the gps was unnecessarily constrained. There were a series of roads and I just needed to move generally in one direction for quite a while. The decision of which of those roads was chosen by the gps was a bit arbitrary.</p>

        <p>If I moved too far in one direction then I could just recorrect by moving over one street. During my trip, the arbitrary paths converged when I reached an underpass. As long as I hit the underpass, the road selection was more open ended than I would have perceived if I wasn't willing to experiment.</p>

        <p>After a few trips, I was completing the entire sequence quickly with greater freedom.</p>
                `
            }, 'writing');
            
            const utilitarian_meditation = renderer.addNode(positions.utilitarian_meditation[0], positions.utilitarian_meditation[1], {
                title: "Utilitarian Meditation", 
                content: `<p>A purpose for meditating is to promote greater general clarity and more readily and deeply absorb works.</p>

        <p>There's also literature associating meditation with reducing stress amongst other benefits.</p>

        <p>Meditation can be something difficult to turn into a baseline habit; instead more readily lending itself to be spoken about than consistently practiced.</p>

        <p>It can be hard to slow down enough to reap the benefits though and introducing tactile, short term benefits can help accommodate this shortcoming.</p>

        <p>Taking a loose definition of meditation as building the capacity to be in the present moment then it doesn't need to be associated with a specific seating position or breathing technique.</p>

        <p>Taking some task which can be done absent mindedly but instead fighting this natural tendency still fits within the definition.</p>

        <p>We are both practicing mindfulness while also completing a task. I've found most tasks can be done more efficiently and with higher quality when we simply pay attention to them. Depending on the natural tendency to be unmindful, the mind may slip into a shallower focus muddying our ability to complete what should be a trivial task.</p>

        <p>All of this to say when doing an absentmindable task; don't be absent minded instead attempt to be present. This both promotes task quality and upstream development.</p>`
            }, 'writing');

            const potemkin_village = renderer.addNode(positions.potemkin_village[0], positions.potemkin_village[1], {
                title: "Potemkin Village",
                content: `<p>Presentation leads to increased serendipity and is widely applicable.</p>

        <p>However, it should only exist as a mechanism for either implying an internal mechanism or enfolding into an ecosystem. If a shiny exterior becomes the goal in it of itself or fit onto very hard as a metric for either parties, issues arise.</p>

        <p>Reminiscent of, "when a measure becomes a target, it ceases to be a good measure".</p>

        <p>With that being said, investing into presentation is worthwhile. Any application of presentation helps build upstream presentation skills aiding in creation. It's interesting to see at least in this sector the trivialization of implementation with even somewhat refined taste.</p>

        <p>I wonder where else this will permeate to in the future.</p>`
            }, 'writing');

            const automaton = renderer.addNode(positions.automaton[0], positions.automaton[1], {
                title: "Automaton",
                content: `<p>Pursuing many disjoint directions creates a sense of pseudo productivity.</p>

        <p>Not only is learning diminished but so is the ability to look at the world through one's own eyes instead of an aggregation of surrounding ones.</p>

        <p>Individually orienting in a unique direction and moving implies confidence. Even if one musters the confidence, the inertia of the initial movement is difficult to overtake and only trivial ideas surface. Past this impasse, a differentiated position is found. Reasoning properly allows the position to be a leveraged one.</p>`
            }, 'writing');

            const self_inflicted_boxes = renderer.addNode(positions.self_inflicted_boxes[0], positions.self_inflicted_boxes[1], {
                title: "Self Inflicted Boxes",
                content: `
        <p>I suspect for many their actions are only a consequence of worry regarding some external factor. Action derived in this way is unsustainable and notions of "breaks" arise naturally.</p>

        <p>A reframing of work and learning is in order – from stress and anxiety to curiosity and enjoyment.</p>

        <p>This deviates from the mindset of an undisciplined person in a critical way. The suggested approach references the traditional path while ultimately deviating from it towards an individualized goal, the undisciplined student relaxes themselves from the traditional path without any real motivation for doing so.</p>`
            }, 'writing');

            const individualized_shortest_paths = renderer.addNode(positions.individualized_shortest_paths[0], positions.individualized_shortest_paths[1], {
                title: "Individualized Shortest Path",
                content: `<p>It's easy to be fixated on the output of a thing instead of learning to enjoy the journey.</p>

        <p>Along the path, there are an abundance of pragmatic, leveraged skills for the reasoned individual.</p>

        <p>Shifting the focus away from impact output has on the individual but instead on creation itself and others reduces the (burden/strain placed/associated on/with) output naturally.</p>

        <p>Moving away from local signal and anxiety and towards individualized truth.</p>

        –

        <p>Referencing a path while ultimately deviating towards an individualized goal though time intensive is wrought with benefits.</p>`
            }, 'writing');

            const affinity_for_technicality = renderer.addNode(positions.affinity_for_technicality[0], positions.affinity_for_technicality[1], {
                title: "Affinity For Technicality",
                content: `<p>It's interesting how many people have dropped the paradigm of programming entirely despite its value proposition.</p>

        <p>Coding can be used as an aid to knowledge acquisition. Coding a thing out and doing so precisely correctly is not an easy thing to do and implies a meaningful depth of understanding.</p>

        <p>It's not just about the act of typing out code. If the code today can be automated tomorrow or today or the day after, shouldn't dictate whether to write the code assuming the information is important.</p>

        <p>This can take a moment to capitulate to. It's very enticing to get rewards especially if those rewards are usually hard fought, misinterpreting it as value. However, if those fights are not actually difficult then the implied value disappears as well. The difficulty of attainment is what prescribes value in the context of knowledge acquisition.</p>

        <p>Less commoditized, programming as a language remains a useful one to speak.</p>

        <p>Fighting for something hard fought is the meaningful thing especially in the context of learning. It's an unfortunate reality people never have the opportunity to revel in this mentality and potentially cease deriving enjoyment from the learning process entirely if it was ever there to begin with.</p>`
            }, 'writing');

            const consumption = renderer.addNode(positions.consumption[0], positions.consumption[1], {
                title: "Consumption",
                content: `<p>Forgetting information becomes easier as our brain becomes conditioned into forgetting and glossing over information.</p>

        <p>We can mitigate the effects by reducing the amount of information we consume and make small efforts to remember the information we're interested in learning.</p>`
            }, 'writing');

            const hatch = renderer.addNode(positions.hatch[0], positions.hatch[1], {
                title: "Hatch",
                content: `<p>Future growth is aided by a reduced regard for the temporary. Tasks done for maintenance or habit expends energy unnecessarily.</p>

                        <p>Instead:</p>
                                <p style="text-indent: 2em;">Allow each moment to promote upstream growth.</p>
                                <p style="text-indent: 2em;">Move towards minimizing energy on tasks associated with little or no growth.</p>

                        <p>Push the envelope for what this means and how it affects life. Streamlining processes as a core habit; removing what's not promoting growth and allowing greater cocooning. Don't be afraid to hatch though.</p>`
            }, 'writing');

            const ghost_races = renderer.addNode(positions.ghost_races[0], positions.ghost_races[1], {
                title: "Ghost Races",
                content: `<p>"Ghosts appear as semi-transparent characters and behave as players who used them."</p>

        <p>See what was done when at a certain time yesterday and see if the timings can be match or improved.</p>

        <p>Everyday is a series of steps stacked upon one another. Atomic habits or some other book speaks to this notion of "habit stacking". Taken to the extreme then, the entire day a complete series of steps.</p>

        <p>There is an extreme rigidity imposed and should only be done over short time frames of great exploitation.</p>`
            }, 'writing');

            const more_is_more = renderer.addNode(positions.more_is_more[0], positions.more_is_more[1], {
                title: "More is more",
                content: `<p>Consume, build, and speak more; consume, build, and speak louder. Fighting the onslaught of noise with louder noise. To not be lost in a crowd and with no end in sight.</p>

        <p>Ironically, doing less may work just as well. Using fewer words to convey complicated ideas. Letting what is said carry weight instead of how it's said.</p>

        <p>More than presentation, simplifications situates concepts more sturdily. Tearing something apart to its constituent limbs and sowing them back together helps understand the motivation for ideas and relationship between them. The audience readily has something to orient themselves with.</p>

        <p>I wonder how many people are genuinely interested in being understood though. There's vulnerability in clearly stating ideas.</p>`
            }, 'writing');

            const lulls = renderer.addNode(positions.lulls[0], positions.lulls[1], {
                title: "Lulls",
                content: `<p>Attention spans are shot.</p>

        <p>Everyone vies for our attention; those adept at grabbing it are those who most readily take it. Attention shifts to attention itself.</p>

        <p>Alternatively, attention can be piqued accomodating a sentence and then a paragraph. With careful construction, a story can be conveyed.</p>

        <p>It remains to actualize a compelling one.</p>`
            }, 'writing');

            const matryoshka = renderer.addNode(positions.matryoshka[0], positions.matryoshka[1], {
                title: "Matryoshka",
                content: `<p>Works and ideas can be seamlessly nestled on one another. One figure subsumes multiple and builds upon them. Naively appearing disjoint but stackable nonetheless. Compositions and recompositions. The process can be repeated indefinitely. Loosely Recursive.</p>

        <p>There's an artisan beauty in the attention to the granular. The number of hands the work falls into, the extent of impact are not entirely out of mind but during implementation attention is on sowing and threading.</p>`
            }, 'writing');
            
            const stones_birds_dominoes = renderer.addNode(positions.stones_birds_dominoes[0], positions.stones_birds_dominoes[1], {
                title: "Stones, Birds, Dominoes",
                content: `<p>I disagree with the eggs in basket paradigm for decision making.</p>

        <p>This implies disjointedness when goals can and should be intertwined. Short term goals are more focused and fitted while long term goals remain nebulous and an ideal to step towards. Stones are minimized and birds are maximized.</p>`
            }, 'writing');
            
            const judgement = renderer.addNode(positions.judgement[0], positions.judgement[1], {
                title: "Judgement",
                content: `<p>Worn as a cloak to assuage feelings, judgment is the most crippling trait and leads to suboptimal views.</p>

        <p>Look to others, practice empathy, and instead find inspiration. A courage is rightfully associated with putting oneself out there. A lack of refinement is natural. Iteration helps us move towards refinement.</p>

        <p>Stated clearly, if we judge others we expect others will treat us similarly. The reality is people don't have the attention span to inspect what we're doing to any meaningful depth and are consumed by fears of judgement themselves.</p>

        <p>If we can practice removing judgement, we can step into individualized paths.</p>`
            }, 'writing');
            
            
            
            const unopinionation = renderer.addNode(positions.unopinionation[0], positions.unopinionation[1], {
                title: "Unopinionation",
                content: `<p>Opinionation can allow for a faster path forward.</p>

        <p>However, naively moving towards opinionation leads to two problems: Immature opinionation looks immature. Naive premises must be reevaluated.</p>

        <p>A lack of opinionation itself allows for a seamless congruency yielding a net positive introduction.</p>

        <p>Correct claims deviating from dogma are hard to come by; not sprung upon but iterated towards.</p>

        <p>During the interim, tasteful unopionation allows for one's works to derive its sheen from the value proposition.</p>`
            }, 'writing');
            
            
            const forward = renderer.addNode(positions.forward[0], positions.forward[1], {
                title: "Forward",
                content: `<p>It's difficult to know what comes first: a belief in oneself to succeed or the complete ensemble of skills to do so.</p>

                <p>It's easy to see, explore, "learn"; instead move – implement.</p>

                <p>Implementation can be stepped into, but faith must be venerated and guarded.</p>

                <p>Implementation takes purpose and faith to fulfill in totality.</p>`
                    }, 'writing');
            
            const axes = renderer.addNode(positions.axes[0], positions.axes[1], {
                title: "Axes",
                content: `<p>In open ended environments, there are many "perturbable axes" to step towards success.</p>

        <p>Perturbing many axes is not desperate or unreasoned. Success is difficult to come by and using any relevant (or naively irrelevant) mechanisms which come to mind can help.</p>

        <p>A single pull from the brain may be the straw teeter tottering success and failure.</p>

        <p>Open mindedness allows for pulls from any which way; providing a viable avenue to derive differentiated ideologies and by extension creations.</p>`
            }, 'writing');
            
            const whimsy = renderer.addNode(positions.whimsy[0], positions.whimsy[1], {
                title: "Whimsy",
                content: `<p>As we get older, whimsy is depleted from us.</p>

        <p>It's so important and it's a tragedy it occurs.</p>

        <p>It's something to be cherished.</p>`
            }, 'writing');

            const caves_and_lights = renderer.addNode(positions.caves_and_lights[0], positions.caves_and_lights[1], {
                title: "Caves and Lights",
                content: `<p>A fixation on end results muddles learning but learning remains potential if it's never actualized.</p>
                <p> Ideal creation is readily represented by delicate balances.</p>
        <p>Learning concepts loosely maps to illuminating a cave: </p>
            <p style="text-indent: 2em;">On the onset, context defines orientation allowing for rudimentary sight of the cave.</p>
            <p style="text-indent: 2em;">The "brightness" of concepts deemed to be pertinent is increased.</p>
            <p style="text-indent: 2em;">Orientation is iteratively found through reevaluating the value proposition.</p>
            <p style="text-indent: 2em;">Learning a lot of information quickly is difficult.</p>
                <p style="text-indent: 4em;">Organized documentation becomes important.</p>

        <p>Serialize appropriately: </p>
            <p style="text-indent: 2em;">When walking across multiple topics getting a bearing on each provides legitimate value.</p>
            <p style="text-indent: 2em;">Not delving into a sub-topic deeply enough is a beginner mistake but delving too far is another.</p>

        <p>Front-load learning as the value proposition becomes clearer then focus more on implementation.</p>

        <p>To keep from pedanticism, things are left here – shortest paths are individualized taken in decisive steps.</p>`
            }, 'writing');

            const mach_horses = renderer.addNode(positions.mach_horses[0], positions.mach_horses[1], {
                title: "Mach Horses",
                content: `
                <p>When something's different, it's hard for people to understand.</p>

                <p>At best, world views are imposed as an attempted pattern match.</p>

                <p>At worst, notions are irreconcilable and rejected as incredulous.</p>

                <p>Leading to unideal circumstances and the obscuring of a vision.</p>

                <p>Instead of subsuming back, we can refine our judgements and act on them.</p>`
            }, 'writing');

            renderer.addEdge(root, irl);
            renderer.addEdge(root, knowledge_acquisition);
            renderer.addEdge(root, orientation);
            renderer.addEdge(root, systems);
            renderer.addEdge(root, implementation);
            
            renderer.addEdge(irl, palo_alto);
            renderer.addEdge(irl, utilitarian_meditation);
            
            renderer.addEdge(knowledge_acquisition, potemkin_village);
            renderer.addEdge(knowledge_acquisition, automaton);
            
            renderer.addEdge(orientation, self_inflicted_boxes);
            renderer.addEdge(self_inflicted_boxes, individualized_shortest_paths);
            renderer.addEdge(orientation, affinity_for_technicality);
            renderer.addEdge(orientation, stones_birds_dominoes);
            renderer.addEdge(orientation, judgement);
            
            renderer.addEdge(systems, consumption);
            renderer.addEdge(systems, hatch);
            renderer.addEdge(systems, ghost_races);
            
            renderer.addEdge(implementation, more_is_more);
            renderer.addEdge(more_is_more, unopinionation);
            renderer.addEdge(implementation, lulls);
            renderer.addEdge(implementation, matryoshka);
            renderer.addEdge(implementation, unopinionation);
            renderer.addEdge(implementation, forward);
            renderer.addEdge(implementation, axes);
            renderer.addEdge(implementation, whimsy);
            renderer.addEdge(implementation, caves_and_lights);
            renderer.addEdge(implementation, mach_horses);

            renderer.draw();
        }

        Tree();
    </script>
</body>
</html>
