<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <style>
        body {
            font-family: 'Alliance No. 1', serif;
            background: #fff;
            color: #000;
            line-height: 1.4;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        header {
            border-bottom: none;
            padding: 60px 20px 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: normal;
            margin: 0;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 220px);
            padding: 0 20px;
        }

        .section-label {
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            width: 100%;
            max-width: 450px;
            margin: 0 0 4px 0;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
            max-width: 450px;
        }

        .post-item {
            border: 1px solid #ddd;
            background: #fff;
            padding: 20px 25px;
        }

        .post-item.reading {
            opacity: 0.5;
        }

        .post-item.folder {
            cursor: default;
        }

        .post-item.child {
            border: 1px solid #ddd;
            background: #fff;
            padding: 12px 25px 12px 40px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .post-item.child:hover {
            transform: translateY(-4px);
        }

        .post-item.child:hover .post-title {
            text-decoration: underline;
        }

        .post-title {
            font-size: 1rem;
            font-weight: normal;
            margin: 0;
            color: #000;
        }

        .post-title.child-title::before {
            content: '→ ';
            color: #999;
        }

        .post-divider {
            width: 100%;
            max-width: 450px;
            border-top: 1px solid #eee;
            margin: 8px 0;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        footer a {
            color: #999;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .post-list { max-width: 90%; }
            .post-item { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Books</h1>
    </header>

    <main>
        <p class="section-label">Currently Reading</p>
        <div class="post-list">
            <article class="post-item reading">
                <h3 class="post-title">Sophie's World</h3>
            </article>
            <article class="post-item reading">
                <h3 class="post-title">The Martian</h3>
            </article>
            <article class="post-item reading">
                <h3 class="post-title">Breadth, Mind, Consciousness</h3>
            </article>
        </div>

        <div class="post-divider"></div>

        <p class="section-label">Read</p>
        <div class="post-list">
            <article class="post-item folder">
                <h3 class="post-title">Startup</h3>
            </article>
            <article class="post-item child" onclick="window.location.href='zero-to-one.html'">
                <h3 class="post-title child-title">Zero to One</h3>
            </article>
        </div>
    </main>
</body>
</html>
