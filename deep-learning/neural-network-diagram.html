<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Diagram</title>
    <style>
        body {
            margin: 0;
            padding: 50px;
            background-color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .network-container {
            position: relative;
            width: 600px;
            height: 400px;
        }

        .node {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid black;
            border-radius: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .input-node-1 {
            top: 80px;
            left: 50px;
        }

        .input-node-2 {
            top: 240px;
            left: 50px;
        }

        .sum-node {
            top: 160px;
            left: 300px;
        }

        .output-node {
            top: 160px;
            left: 500px;
            font-size: 24px;
        }

        .connection {
            position: absolute;
            height: 2px;
            background-color: black;
            transform-origin: left center;
        }

        .weight {
            position: absolute;
            background-color: white;
            padding: 2px 6px;
            border: 1px solid black;
            font-size: 12px;
            font-weight: bold;
        }

        .connection-1 {
            top: 109px;
            left: 110px;
            width: 220px;
            transform: rotate(10deg);
        }

        .weight-1 {
            top: 95px;
            left: 200px;
        }

        .connection-2 {
            top: 269px;
            left: 110px;
            width: 220px;
            transform: rotate(-10deg);
        }

        .weight-2 {
            top: 280px;
            left: 200px;
        }

        .connection-output {
            top: 189px;
            left: 360px;
            width: 140px;
        }

        .label {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
        }

        .input-label-1 {
            top: 60px;
            left: 70px;
        }

        .input-label-2 {
            top: 220px;
            left: 70px;
        }

        .sum-label {
            top: 140px;
            left: 315px;
        }

        .output-label {
            top: 140px;
            left: 510px;
        }
    </style>
</head>
<body>
    <div class="network-container">
        <!-- Input Nodes -->
        <div class="node input-node-1">x₁</div>
        <div class="node input-node-2">x₂</div>
        
        <!-- Sum Node -->
        <div class="node sum-node">Σ</div>
        
        <!-- Output Node -->
        <div class="node output-node">?</div>
        
        <!-- Connections -->
        <div class="connection connection-1"></div>
        <div class="connection connection-2"></div>
        <div class="connection connection-output"></div>
        
        <!-- Weights -->
        <div class="weight weight-1">w₁</div>
        <div class="weight weight-2">w₂</div>
        
        <!-- Labels -->
        <div class="label input-label-1">Input 1</div>
        <div class="label input-label-2">Input 2</div>
        <div class="label sum-label">Sum</div>
        <div class="label output-label">Output</div>
    </div>
</body>
</html>
